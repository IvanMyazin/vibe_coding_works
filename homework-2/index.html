<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ночь в музее</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="card">
      <h1 id="event-title"></h1>
      <p id="event-date"></p>
      <p id="event-place"></p>
      <p id="event-description"></p>
      <button id="show-program" type="button">Показать программу</button>
      <p id="program" hidden></p>
    </div>

    <p id="data-error" class="error" hidden></p>

    <form id="service-form" class="services" hidden>
      <h2>Дополнительные услуги</h2>
      <p><label><input type="checkbox" id="guide"> Экскурсия с гидом — 500 руб.</label></p>
      <p><label><input type="checkbox" id="audio"> Аудиогид — 350 руб.</label></p>
      <p><label><input type="checkbox" id="catalog"> Каталог выставки — 250 руб.</label></p>
      <button type="submit">Рассчитать</button>
    </form>

    <p id="choice-error" class="error" hidden></p>
    <p id="result" class="report" hidden></p>
    <pre id="report-json" class="report" hidden></pre>
  </main>
  <script src="app.js"></script>
</body>
</html>
